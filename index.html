<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Login | Dashboard Jasher</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="login-page">
  <div class="login-card">
    <h1>🔐 Jasher Bot</h1>
    <input id="username" type="text" placeholder="Username" autocomplete="username"/>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password"/>
    <div class="row">
      <button id="loginBtn">Masuk</button>
      <button id="registerBtn" class="ghost">Daftar</button>
    </div>
    <p id="loginError" class="error"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAL6hI8FsjvhGB2HbtSxobTApiTV0T1-sI",
      authDomain: "jasherweb.firebaseapp.com",
      databaseURL: "https://jasherweb-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "jasherweb",
      storageBucket: "jasherweb.firebasestorage.app",
      messagingSenderId: "209911970769",
      appId: "1:209911970769:web:60a2db423fc75557afbef0",
      measurementId: "G-0LT861DZM2"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const registerBtn = document.getElementById("registerBtn");
    const loginError = document.getElementById("loginError");

    loginBtn.addEventListener("click", async () => {
      loginError.textContent = "";
      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      if (!username || !password) return loginError.textContent = "Isi username & password.";
      const userDoc = await getDoc(doc(db, "login", username));
      if (!userDoc.exists() || userDoc.data().password !== password) {
        loginError.textContent = "❌ Username/password salah.";
        return;
      }
      localStorage.setItem("username", username);
      localStorage.setItem("role", userDoc.data().role || "user");
      window.location.href = "dashboard.html";
    });

    registerBtn.addEventListener("click", async () => {
      loginError.textContent = "";
      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      if (!username || !password) return loginError.textContent = "Isi username & password.";
      const userDoc = await getDoc(doc(db, "login", username));
      if (userDoc.exists()) return loginError.textContent = "❌ Username sudah dipakai.";
      await setDoc(doc(db, "login", username), { password, role: "user" });
      alert("✅ Akun Berhasil Dibuat Silahkan login.");
    });
  </script>
</body>
</html>
